# fly.toml app configuration file generated for otwptn-wa on 2026-11-05T22:50:06+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'otwptn-wa'
primary_region = 'sin'

[build]

# The Baileys WhatsApp session is a singleton: two live instances using the same credentials kick
# each other off WhatsApp. Keep exactly ONE machine and never roll out with overlap.
[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
